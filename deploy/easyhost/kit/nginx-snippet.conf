# ORECH/DIN: the same rules as .htaccess, for a server that runs nginx and ignores .htaccess files.
# Give this to Easyhost support ("please add these rules for www.orechdin.be") if the .htaccess test fails.
# It belongs inside the server { ... } block of the website.

error_page 404 /404.html;
autoindex off;

# One canonical address: the bare domain forwards to www.
if ($host = orechdin.be) { return 301 https://www.orechdin.be$request_uri; }

# The bare address and the old Wix addresses.
location = / { return 301 /en/; }
location ~ ^/the-office/?$ { return 301 /en/office/; }
location ~ ^/services/?$ { return 301 /en/services/; }
location ~ ^/contact-8/?$ { return 301 /en/contact/; }
location ~ ^/privacy-policy/?$ { return 301 /en/privacy/; }
location ~ ^/cookies/?$ { return 301 /en/cookies/; }

# Security headers (same as Vercel).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.google.com/maps" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-DNS-Prefetch-Control "on" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Caching.
location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
location /media/ { add_header Cache-Control "public, max-age=604800"; }
location ~* \.html$ { add_header Cache-Control "no-cache"; }
location /api/ { add_header X-Robots-Tag "noindex, nofollow"; add_header Cache-Control "no-store"; }
